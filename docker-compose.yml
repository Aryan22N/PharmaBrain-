version: "3.9"

services:
  python-ocr:
    build:
      context: ./model
      dockerfile: Dockerfile
    container_name: prescription-ocr-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_TOKEN=${API_TOKEN:-rx_local_dev_token_2026_secure}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/rx_local.db}
      - PADDLEOCR_DEVICE=cpu
      - HOST=0.0.0.0
      - FRONTEND_ORIGIN=http://localhost:3000
      - FLAGS_use_mkldnn=0
      - FLAGS_enable_pir_api=0
      - FLAGS_enable_pir_in_executor=0
    volumes:
      - paddlex-cache:/root/.paddlex
      - db-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prescription-intelligence-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      python-ocr:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PYTHON_API_URL=http://python-ocr:8000
      - PYTHON_API_TOKEN=${PYTHON_API_TOKEN:-rx_local_dev_token_2026_secure}
      - DATABASE_URL=${DATABASE_URL}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://dvydfsahkqzgluusdsnn.supabase.co}
      - SUPABASE_URL=${SUPABASE_URL:-https://dvydfsahkqzgluusdsnn.supabase.co}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-OCR_Images}
      - SUPABASE_STORAGE_FOLDER=${SUPABASE_STORAGE_FOLDER:-uploads}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

volumes:
  paddlex-cache:
    driver: local
  db-data:
    driver: local
